name: TikTok to Feishu Sync

on:
  schedule:
    # 19:00 UTC is 03:00 the following day in Malaysia.
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tiktok-feishu-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check certifi cryptography

      - name: Synchronize TikTok analytics into Base
        env:
          SYNC_ENCRYPTION_KEY: ${{ secrets.SYNC_ENCRYPTION_KEY }}
        run: python automation/sync.py

      - name: Rebuild combined Scoban and Saludent Sheet
        env:
          SYNC_ENCRYPTION_KEY: ${{ secrets.SYNC_ENCRYPTION_KEY }}
        run: python automation/base_to_sheet.py

      - name: Save rotated encrypted token
        run: |
          if git diff --quiet -- automation/state.enc; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/state.enc
          git commit -m "Refresh encrypted TikTok token"
          git push
